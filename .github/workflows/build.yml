# Release rails. Everything that checks the code lives in test.yml and runs on
# every push; this file runs on a tag and only publishes what those checks have
# already passed.
#
# In v1 the order was the other way round: the only workflow was this one, on
# `release: published`, and nothing ran tests at all.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # git describe needs the tags

      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }

      - name: Build every platform
        env:
          BUILD_ALL: '1'
        run: ./build.sh

      - name: The built binary must know its own version
        run: |
          # This is the check v1 never had: its ldflags named a package that did
          # not exist, so every release printed "unknown".
          out=$(./build/migrator_linux_amd64 version)
          echo "$out"
          case "$out" in
            *unknown*) echo "the binary does not know its version"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/* --clobber

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Read the toolchain version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: distroless
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/efureev/migrator:${{ steps.meta.outputs.version }}
            ghcr.io/efureev/migrator:latest

      - name: Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: shell
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/efureev/migrator:${{ steps.meta.outputs.version }}-alpine
            ghcr.io/efureev/migrator:latest-alpine
