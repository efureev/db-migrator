# Локальная PostgreSQL для интеграционных тестов: make db-up / make db-down.
#
# Порт нестандартный намеренно: интеграционные тесты создают и удаляют базы
# и проверяют wipe — то есть делают с сервером ровно то, чего нельзя сделать
# с базой чужого проекта, случайно оказавшейся на стандартном порту.
#
# 55439, а не 55432: 55432 уже занят docker-compose соседнего проекта того же
# автора (go-outbox). Тесты тогда молча уходили на чужой сервер и падали на
# аутентификации — повезло. Разлёт был бы ограничен и так (Fresh создаёт свою
# базу mig_<random> и удаляет только её), но выбирать порт по принципу
# «наверное, свободен» — плохая ставка. Занят и этот — правьте здесь и
# в Makefile одной парой.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: migrator
      POSTGRES_DB: migrator_test
    ports: ['127.0.0.1:55439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U migrator -d migrator_test']
      interval: 2s
      timeout: 3s
      retries: 15
    # Данные держим в tmpfs: тестовой базе незачем переживать перезагрузку,
    # а fsync на каждую миграцию заметно замедляет прогон.
    #
    # Точка монтирования — /var/lib/postgresql, НЕ /var/lib/postgresql/data.
    # Образ postgres:18+ хранит данные в подкаталоге с номером мажорной версии
    # и отказывается стартовать, если что-то смонтировано в старое место:
    # «There appears to be PostgreSQL data in /var/lib/postgresql/data
    # (unused mount/volume)». Контейнер при этом падает с кодом 1, а не
    # деградирует, — что и правильно.
    tmpfs: ['/var/lib/postgresql']
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
